<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Inter+Tight:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <strong id="nom"></strong>
    <nav aria-label="Navigation principale">
      <a href="#accueil" id="t-home">Accueil</a><a href="#cv" id="t-cv">CV</a>
    </nav>
  </header>
  <main>
    <div class="hero v-home">
      <!-- Phrase glosée : à modifier librement (un <li> par mot) -->
      <ul class="gloss" aria-label="Phrase glosée : There are no facts, only interpretations">
        <li><span class="w">There</span><span class="g">EXPL</span></li>
        <li><span class="w">are</span><span class="g">be.PRS.PL</span></li>
        <li><span class="w">no</span><span class="g">NEG.DET</span></li>
        <li><span class="w">facts,</span><span class="g">fact.PL</span></li>
        <li><span class="w">only</span><span class="g">only</span></li>
        <li><span class="w">interpretations</span><span class="g">interpretation.PL</span></li>
      </ul>
      <p class="trad">« Il n’y a pas de faits, seulement des interprétations. » — Nietzsche, fragments posthumes (1886-1887)</p>
      <h1 id="titre"></h1>
      <p class="lead" id="lead"></p>
    </div>
    <section id="axes" class="v-home"><h2>Axes de travail</h2><div class="axes" id="axes-liste"></div></section>
    <section id="textes" class="v-home">
      <h2>Textes</h2>
      <div class="filters" id="filtres" role="group" aria-label="Filtrer par thème"></div>
      <ul class="texts" id="liste"></ul>
    </section>
    <section id="cv-content" class="cv v-cv" hidden></section>
    <section id="article" class="art v-art" hidden></section>
    <section id="contact" class="v-home"><h2>Contact</h2><p class="note" id="contact-texte"></p></section>
  </main>
  <footer id="pied"></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
